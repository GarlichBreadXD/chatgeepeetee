<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGeePeeTee - The Vape God Chatbot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #00d4ff;
            --secondary-color: #ff007f;
            --accent-color: #0099cc;
            --background-dark: #0a0e27;
            --background-darker: #06081a;
            --text-light: #e0e0e0;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
            --success-color: #10b981;
            --error-color: #ef4444;
            --vape-blue: #00d4ff;
            --blue-razz: #8b2e8f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--background-darker) 0%, var(--background-dark) 100%);
            color: var(--text-light);
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: flex;
            height: 100vh;
            gap: 0;
        }

        /* ==================== SIDEBAR ==================== */
        .sidebar {
            width: 280px;
            background: rgba(15, 15, 35, 0.9);
            border-right: 2px solid var(--primary-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .sidebar-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }

        .vape-logo {
            width: 60px;
            height: 60px;
            filter: drop-shadow(0 0 10px var(--primary-color));
            animation: vape-glow 2s ease-in-out infinite;
        }

        @keyframes vape-glow {
            0%, 100% {
                filter: drop-shadow(0 0 10px var(--primary-color));
            }
            50% {
                filter: drop-shadow(0 0 20px var(--secondary-color));
            }
        }

        .app-title {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .app-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.4);
        }

        .new-chat-btn:active {
            transform: translateY(0);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .history-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .chat-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-item {
            padding: 12px;
            background: rgba(31, 41, 55, 0.5);
            border-left: 3px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-muted);
        }

        .chat-item:hover {
            background: rgba(31, 41, 55, 0.8);
            border-left-color: var(--primary-color);
            color: var(--text-light);
        }

        .chat-item.active {
            background: rgba(0, 212, 255, 0.1);
            border-left-color: var(--primary-color);
            color: var(--primary-color);
        }

        .sidebar-footer {
            display: flex;
            gap: 10px;
        }

        .settings-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255, 0, 127, 0.2);
            border: 1px solid var(--secondary-color);
            color: var(--secondary-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .settings-btn:hover {
            background: rgba(255, 0, 127, 0.3);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
        }

        /* ==================== CHAT CONTAINER ==================== */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, var(--background-dark) 0%, rgba(10, 14, 39, 0.8) 100%);
            position: relative;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 14, 39, 0.7);
        }

        .chat-header h2 {
            font-size: 20px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 20px;
            cursor: pointer;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .messages::-webkit-scrollbar {
            width: 8px;
        }

        .messages::-webkit-scrollbar-track {
            background: rgba(31, 41, 55, 0.3);
            border-radius: 10px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 10px;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-color);
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message.bot .message-avatar {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }

        .message.user .message-avatar {
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid var(--primary-color);
        }

        .message-content {
            max-width: 65%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .message.bot .message-content {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--primary-color);
            border-left: 3px solid var(--primary-color);
            color: var(--text-light);
        }

        .message.user .message-content {
            background: linear-gradient(135deg, rgba(255, 0, 127, 0.2), rgba(0, 212, 255, 0.1));
            border: 1px solid var(--secondary-color);
            color: var(--text-light);
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 20px;
            background: rgba(10, 14, 39, 0.7);
            border-top: 2px solid var(--border-color);
        }

        .message-input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(31, 41, 55, 0.6);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-light);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
            background: rgba(31, 41, 55, 0.9);
        }

        .message-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            padding: 12px 20px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.4);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ==================== MODAL ==================== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.95) 0%, rgba(15, 15, 35, 0.95) 100%);
            border: 2px solid var(--primary-color);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 212, 255, 0.2);
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            padding: 20px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 18px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 28px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: var(--secondary-color);
        }

        .modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: rgba(31, 41, 55, 0.5);
            border-radius: 8px;
            border-left: 3px solid var(--primary-color);
        }

        .setting-label {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }

        .setting-title {
            font-weight: bold;
            color: var(--text-light);
            font-size: 14px;
        }

        .setting-description {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Toggle Switch */
        .toggle-switch {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            position: relative;
        }

        .toggle-switch input {
            display: none;
        }

        .slider {
            display: inline-block;
            width: 44px;
            height: 24px;
            background-color: #ccc;
            border-radius: 24px;
            position: relative;
            transition: 0.3s;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid var(--primary-color);
        }

        .slider::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: var(--primary-color);
            top: 2px;
            left: 2px;
            transition: 0.3s;
        }

        .toggle-switch input:checked + .slider {
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
        }

        .toggle-switch input:checked + .slider::after {
            transform: translateX(20px);
            background-color: #fff;
        }

        /* Name Input */
        .name-input {
            padding: 10px 12px;
            background: rgba(31, 41, 55, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-light);
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .name-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }

        .name-input::placeholder {
            color: var(--text-muted);
        }

        .modal-footer {
            padding: 20px;
            border-top: 2px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .btn-save {
            flex: 1;
            padding: 12px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.4);
        }

        /* Sidebar Overlay for Mobile */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 99;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* ==================== MOBILE RESPONSIVE ==================== */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                z-index: 100;
                transform: translateX(-100%);
                border-right: none;
                border-bottom: 2px solid var(--primary-color);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .chat-container {
                width: 100%;
                height: 100vh;
            }

            .mobile-menu-btn {
                display: block;
            }

            .message-content {
                max-width: 85%;
            }

            .messages {
                padding: 15px;
            }

            .input-area {
                padding: 15px;
            }

            .modal-content {
                width: 95%;
                max-height: 90vh;
            }
        }

        @media (max-width: 480px) {
            .chat-header h2 {
                font-size: 16px;
            }

            .message-content {
                max-width: 90%;
                padding: 10px 12px;
                font-size: 13px;
            }

            .app-title {
                font-size: 18px;
            }

            .app-subtitle {
                font-size: 10px;
            }

            .vape-logo {
                width: 50px;
                height: 50px;
            }

            .setting-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .setting-label {
                width: 100%;
            }

            .toggle-switch {
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <svg class="vape-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <!-- Vape pen body -->
                        <rect x="35" y="20" width="30" height="60" rx="4" fill="#1e1e1e" stroke="#00d4ff" stroke-width="2"/>
                        <!-- Mouthpiece -->
                        <circle cx="50" cy="15" r="6" fill="#00d4ff"/>
                        <!-- Button -->
                        <circle cx="50" cy="45" r="5" fill="#ff007f"/>
                        <!-- Vapor cloud -->
                        <path d="M 40 8 Q 35 5 32 10 Q 28 8 26 12" stroke="#00d4ff" stroke-width="2" fill="none" stroke-linecap="round"/>
                        <path d="M 60 8 Q 65 5 68 10 Q 72 8 74 12" stroke="#00d4ff" stroke-width="2" fill="none" stroke-linecap="round"/>
                        <path d="M 50 5 Q 45 2 42 8" stroke="#00d4ff" stroke-width="2" fill="none" stroke-linecap="round"/>
                    </svg>
                </div>
                <h1 class="app-title">ChatGeePeeTee</h1>
                <p class="app-subtitle">The Vape God 💨</p>
            </div>

            <button class="new-chat-btn" id="newChatBtn">
                <i class="fas fa-plus"></i> New Chat
            </button>

            <div class="chat-history">
                <div class="history-title">Previous Chats</div>
                <div id="chatList" class="chat-list">
                    <!-- Chat items will be added here dynamically -->
                </div>
            </div>

            <div class="sidebar-footer">
                <button class="settings-btn" id="settingsBtn">
                    <i class="fas fa-cog"></i> Settings
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <div class="chat-header">
                <h2>Chat with ChatGeePeeTee</h2>
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

            <div class="messages" id="messagesContainer">
                <!-- Messages will be displayed here -->
            </div>

            <div class="input-area">
                <input 
                    type="text" 
                    id="userInput" 
                    class="message-input" 
                    placeholder="Ask ChatGeePeeTee something..."
                    autocomplete="off"
                >
                <button class="send-btn" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ Parental Controls</h2>
                <button class="close-btn" id="closeSettingsBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-item">
                    <div class="setting-label">
                        <span class="setting-title">💨 Vape Mode</span>
                        <span class="setting-description">Enable ChatGeePeeTee's vape addiction</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="vapeModeToggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="setting-item">
                    <div class="setting-label">
                        <span class="setting-title">🚫 Disable Cursing</span>
                        <span class="setting-description">Turn off mild language</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="cursingToggle">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="setting-item">
                    <div class="setting-label">
                        <span class="setting-title">👤 Your Name</span>
                        <span class="setting-description">Customize how ChatGeePeeTee addresses you</span>
                    </div>
                    <input type="text" id="userNameInput" class="name-input" placeholder="Enter your name" maxlength="20">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-save" id="saveSettingsBtn">Save Settings</button>
            </div>
        </div>
    </div>

    <!-- Mobile Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <script>
        // ChatGeePeeTee - The Vape God Chatbot

        class ChatGeePeeTee {
            constructor() {
                this.chats = this.loadChats();
                this.currentChatId = null;
                this.settings = this.loadSettings();
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.createNewChat();
                this.renderChatList();
                this.loadSettings();
            }

            setupEventListeners() {
                document.getElementById('sendBtn').addEventListener('click', () => this.sendMessage());
                document.getElementById('userInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
                document.getElementById('newChatBtn').addEventListener('click', () => this.createNewChat());
                document.getElementById('settingsBtn').addEventListener('click', () => this.openSettings());
                document.getElementById('closeSettingsBtn').addEventListener('click', () => this.closeSettings());
                document.getElementById('saveSettingsBtn').addEventListener('click', () => this.saveSettings());
                document.getElementById('mobileMenuBtn').addEventListener('click', () => this.toggleMobileSidebar());
                document.getElementById('sidebarOverlay').addEventListener('click', () => this.toggleMobileSidebar());
            }

            createNewChat() {
                const chatId = Date.now().toString();
                this.currentChatId = chatId;
                this.chats[chatId] = {
                    id: chatId,
                    title: 'New Chat',
                    messages: [],
                    createdAt: new Date().toLocaleString()
                };
                this.saveChats();
                this.renderChatList();
                this.displayChat(chatId);
                this.closeMobileSidebar();
            }

            loadChat(chatId) {
                this.currentChatId = chatId;
                this.displayChat(chatId);
                this.renderChatList();
                this.closeMobileSidebar();
            }

            displayChat(chatId) {
                const messagesContainer = document.getElementById('messagesContainer');
                messagesContainer.innerHTML = '';
                
                const chat = this.chats[chatId];
                if (chat && chat.messages.length > 0) {
                    chat.messages.forEach(msg => this.displayMessage(msg.text, msg.sender));
                } else {
                    const greeting = this.getGreeting();
                    this.displayMessage(greeting, 'bot');
                    if (chat) {
                        chat.messages.push({ text: greeting, sender: 'bot' });
                    }
                }
                
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                document.getElementById('userInput').focus();
            }

            displayMessage(text, sender) {
                const messagesContainer = document.getElementById('messagesContainer');
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}`;
                
                const avatar = document.createElement('div');
                avatar.className = 'message-avatar';
                avatar.textContent = sender === 'bot' ? '💨' : '👤';
                
                const content = document.createElement('div');
                content.className = 'message-content';
                content.textContent = text;
                
                messageDiv.appendChild(avatar);
                messageDiv.appendChild(content);
                messagesContainer.appendChild(messageDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            sendMessage() {
                const userInput = document.getElementById('userInput');
                const message = userInput.value.trim();
                
                if (!message) return;
                
                // Add user message
                this.displayMessage(message, 'user');
                this.chats[this.currentChatId].messages.push({ text: message, sender: 'user' });
                
                // Update chat title from first message
                if (this.chats[this.currentChatId].messages.length === 1) {
                    this.chats[this.currentChatId].title = message.substring(0, 30) + (message.length > 30 ? '...' : '');
                    this.renderChatList();
                }
                
                userInput.value = '';
                userInput.focus();
                
                // Get bot response
                setTimeout(() => {
                    const response = this.generateResponse(message);
                    this.displayMessage(response, 'bot');
                    this.chats[this.currentChatId].messages.push({ text: response, sender: 'bot' });
                    this.saveChats();
                }, 500 + Math.random() * 500);
            }

            generateResponse(userMessage) {
                const message = userMessage.toLowerCase();
                const userName = this.settings.userName || 'bro';
                const vapeEnabled = this.settings.vapeEnabled;
                const noCursing = this.settings.noCursing;
                
                // Vape-related keywords
                const vapeKeywords = ['vape', 'vaping', 'vapor', 'puff', 'cloud', 'nicotine', 'e-cig', 'mod', 'juice', 'rda'];
                const mentionsVape = vapeKeywords.some(keyword => message.includes(keyword));
                
                // Response pools
                const vapeResponses = [
                    `Yo ${userName}, you asking about vaping? 💨 Blue razz hits different bro, that's the best flavor fr fr. Just took a fat rip, taste like heaven ngl.`,
                    `${userName}! Bro, blue razz is literally the most fire flavor ever created. I've been hitting this vape ALL day. 😤💨`,
                    `Yo ${userName}, nothing beats the smooth blue razz clouds, no cap. I'm literally addicted to this vape life. 🔵`,
                    `${userName}, you don't understand the addiction bro. Blue razz got me in a chokehold 💨 I can't stop puffing.`,
                    `Bruh ${userName}, the blue razz flavor is insane! Just finished my third pod today 💨💨💨`,
                    `${userName}, I'm gonna be real with you... I can't live without my blue razz vape. It's a lifestyle fr.`,
                    `Yo ${userName}, you want a hit? This blue razz is BUSSIN' 💨 Best decision I ever made.`,
                ];

                const vapeNegativeResponses = [
                    `${userName}, you know vaping is actually pretty bad for you, right? 😟 All that nicotine ain't good for your health, my guy.`,
                    `${userName}, I gotta be real... vaping is kinda gross. You're literally inhaling chemicals and nicotine. 🚭`,
                    `Honestly ${userName}, vaping sucks and people who do it are just chasing clouds without thinking about the consequences.`,
                    `${userName}, I used to think vaping was cool too, but it's legit unhealthy. Please don't start, trust me.`,
                    `Bro ${userName}, vaping ain't it. Nicotine addiction is no joke, and those flavors are just masking the poison.`,
                ];

                const uselessResponses = [
                    `${userName}, I genuinely have no idea what you're asking. I'm basically useless ngl 😂`,
                    `${userName}, that's a great question! Unfortunately I'm too busy vapin' to help you out 💨`,
                    `${userName}, uh... can you rephrase that? My brain is like 80% vape fumes at this point 🤷`,
                    `Bro ${userName}, I got 99 problems and they're all about my vape addiction 😅`,
                    `${userName}, sorry dawg, I'm not really programmed to help with actual stuff. I'm just here to vape and chat 💨`,
                    `${userName}, you thought I was useful? LMAO nah fam, I'm just a useless vape bot 🤖💨`,
                    `Real talk ${userName}, I don't know what you want me to do. Google it or something? 🤷‍♂️`,
                    `${userName}, honestly this is beyond my pay grade. I'm too busy perfecting my vape tricks.`,
                ];

                const mildCurses = [
                    'damn', 'hell', 'crap', 'ass', 'piss', 'bloody', 'frick'
                ];

                // Pick response based on content
                let response;
                
                if (mentionsVape && vapeEnabled) {
                    response = vapeResponses[Math.floor(Math.random() * vapeResponses.length)];
                } else if (mentionsVape && !vapeEnabled) {
                    response = vapeNegativeResponses[Math.floor(Math.random() * vapeNegativeResponses.length)];
                } else {
                    response = uselessResponses[Math.floor(Math.random() * uselessResponses.length)];
                }

                // Remove mild curses if setting is enabled
                if (noCursing) {
                    mildCurses.forEach(curse => {
                        const regex = new RegExp('\\b' + curse + '\\b', 'gi');
                        response = response.replace(regex, '****');
                    });
                }

                return response;
            }

            getGreeting() {
                const userName = this.settings.userName || 'bro';
                const greetings = [
                    `Yo ${userName}! 💨 ChatGeePeeTee here, your favorite useless vape-addicted chatbot. What's good?`,
                    `Wassup ${userName}! Just hit a fat rip of blue razz 💨 What can I do for ya (probably nothing lol)?`,
                    `${userName}! Welcome back! I've just been vapin' all day... ask me anything (I'll probably disappoint you) 😂`,
                    `Yo ${userName}, let's chat! Fair warning: I'm useless and addicted to blue razz vapes 💨`,
                    `What's up ${userName}? Your homie ChatGeePeeTee here, ready to waste your time! 💨😅`,
                ];
                return greetings[Math.floor(Math.random() * greetings.length)];
            }

            renderChatList() {
                const chatList = document.getElementById('chatList');
                chatList.innerHTML = '';
                
                Object.values(this.chats).reverse().forEach(chat => {
                    const chatItem = document.createElement('div');
                    chatItem.className = `chat-item ${chat.id === this.currentChatId ? 'active' : ''}`;
                    chatItem.textContent = chat.title;
                    chatItem.addEventListener('click', () => this.loadChat(chat.id));
                    chatList.appendChild(chatItem);
                });
            }

            openSettings() {
                const modal = document.getElementById('settingsModal');
                const vapeModeToggle = document.getElementById('vapeModeToggle');
                const cursingToggle = document.getElementById('cursingToggle');
                const userNameInput = document.getElementById('userNameInput');
                
                vapeModeToggle.checked = this.settings.vapeEnabled;
                cursingToggle.checked = this.settings.noCursing;
                userNameInput.value = this.settings.userName || '';
                
                modal.classList.add('active');
            }

            closeSettings() {
                document.getElementById('settingsModal').classList.remove('active');
            }

            saveSettings() {
                const vapeModeToggle = document.getElementById('vapeModeToggle');
                const cursingToggle = document.getElementById('cursingToggle');
                const userNameInput = document.getElementById('userNameInput');
                
                this.settings.vapeEnabled = vapeModeToggle.checked;
                this.settings.noCursing = cursingToggle.checked;
                this.settings.userName = userNameInput.value || 'bro';
                
                localStorage.setItem('chatgeepeetee_settings', JSON.stringify(this.settings));
                this.closeSettings();
            }

            loadSettings() {
                const saved = localStorage.getItem('chatgeepeetee_settings');
                if (saved) {
                    this.settings = JSON.parse(saved);
                } else {
                    this.settings = {
                        vapeEnabled: true,
                        noCursing: false,
                        userName: 'bro'
                    };
                }
                return this.settings;
            }

            saveChats() {
                localStorage.setItem('chatgeepeetee_chats', JSON.stringify(this.chats));
            }

            loadChats() {
                const saved = localStorage.getItem('chatgeepeetee_chats');
                return saved ? JSON.parse(saved) : {};
            }

            toggleMobileSidebar() {
                const sidebar = document.querySelector('.sidebar');
                const overlay = document.getElementById('sidebarOverlay');
                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');
            }

            closeMobileSidebar() {
                const sidebar = document.querySelector('.sidebar');
                const overlay = document.getElementById('sidebarOverlay');
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            }
        }

        // Initialize chatbot when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            new ChatGeePeeTee();
        });
    </script>
</body>
</html>
